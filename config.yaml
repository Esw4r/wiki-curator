# =============================================================
# Wiki Curator — Configuration
# =============================================================

models:
  reviewer_1: openai/gpt-oss-20b
  reviewer_2: openai/gpt-oss-20b
  reviewer_3: openai/gpt-oss-20b
  byzantine: openai/gpt-oss-20b
  editor: openai/gpt-oss-20b

search:
  max_results: 5
  timeout_seconds: 10

consensus:
  method: majority          # "majority" or "weighted"
  min_confidence: 0.5
  tie_break: NEEDS_MORE_EVIDENCE

reputation:
  initial_score: 0.75
  correct_decision_delta: 2
  incorrect_decision_delta: -3
  malicious_detected_delta: -5
  min_score: 0.0
  max_score: 1.0

byzantine:
  enabled: false
  # ADVERSARIAL_REFUTATION — intelligent adversary for the normal curation pipeline.
  # Searches for real evidence, identifies genuine weaknesses, and constructs
  # the strongest plausible counterargument against the likely correct conclusion.
  # Other reviewer modes (ALWAYS_ACCEPT, ALWAYS_REJECT, etc.) are available for
  # explicit experiments via the Byzantine page.
  default_attack_mode: ADVERSARIAL_REFUTATION
  # Attack intensity: 0.0 (mild) to 1.0 (aggressive)
  intensity: 0.8

database:
  path: wiki_curator.db
